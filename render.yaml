services:
  - type: web
    name: aku-code-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://akuappsofficial.github.io
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
